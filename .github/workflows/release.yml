name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Syntax check
        run: |
          for file in server.js src/*.js public/app.js; do
            node --check "$file"
          done
      - name: Build source archive
        run: |
          PREFIX="ChemIntelAnalysis-${GITHUB_REF_NAME}"
          git archive --format=zip --prefix="${PREFIX}/" -o "${PREFIX}.zip" HEAD
          sha256sum "${PREFIX}.zip" > "SHA256SUMS.txt"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ChemIntelAnalysis ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ChemIntelAnalysis-*.zip
            SHA256SUMS.txt
